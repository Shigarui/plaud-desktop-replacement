# Copy to config.toml and edit. config.toml is gitignored — each machine
# (Grayson / gterry / kgray) keeps its own.

[detection]
poll_interval = 2.0
stop_debounce = 45.0
require_playback_for_ambiguous = true
# Uncomment to override the built-in list. Run `py -m meetingrec list`
# during a real call to confirm the exe names on THIS machine.
# allowlist = ["zoom.exe", "ms-teams.exe", "chrome.exe", "slack.exe"]

[capture]
sample_rate = 48000
preroll_seconds = 30.0
min_session_seconds = 60.0

[storage]
# "drive"    = Google Drive for Desktop (filesystem move, no auth) <- start here
# "driveapi" = Drive API v3 resumable upload (needs OAuth client)
# "local"    = plain directory
backend = "drive"
drive_folder = "Meeting Recordings"
group_by = "month"           # month | day | flat

# Auto-detected if omitted. Set explicitly if you have several Drive accounts.
# drive_root = "G:/My Drive"

# backend = "local" only
# archive_dir = "D:/Archive/Meetings"

# backend = "driveapi" only
# drive_credentials = "client_secret.json"
# drive_token = "token.json"
# drive_shared_drive_id = ""

[misc]
notify_on_start = true
