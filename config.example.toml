# Copy to config.toml and edit. config.toml is gitignored — every machine
# keeps its own, because device names differ and a wrong one records silence.
#
# Everything here has a working default in config.py; uncomment only what you
# need to change. The values shown are the defaults.

[detection]
poll_interval = 2.0
stop_debounce = 45.0            # muting does not release the mic, so this is
                                # really for device switches and tab reloads
require_playback_for_ambiguous = true

# Replaces the built-in list entirely, so include everything you use.
# Run `py -m meetingrec list` during a real call to get exact names —
# new Teams reports as a packaged identity, not an exe.
# allowlist = ["msteams_8wekyb3d8bbwe", "teams.exe", "ms-teams.exe",
#              "zoom.exe", "slack.exe", "webexmta.exe",
#              "chrome.exe", "msedge.exe", "firefox.exe"]

# Browsers need a playback session too, or voice-typing would trigger a
# recording. Listed names must also appear in allowlist.
# ambiguous = ["chrome.exe", "msedge.exe", "firefox.exe"]

[capture]
sample_rate = 48000
preroll_seconds = 30.0          # system audio only; the mic opens on demand
min_session_seconds = 60.0      # shorter meetings are DELETED, not archived

# Mics in priority order. Put the device you actually wear first: a dongle
# whose headset is switched off opens cleanly and records pure digital
# silence. There is a watchdog for that, but it costs 12 seconds.
# Partial names match.
# mic_device = ["Headset (soundcore Liberty 5 Pro Max)",
#               "Headset Microphone (Poly BT700)"]

# Force the capture rate. Some Bluetooth endpoints accept 48000 and upsample
# a 16 kHz link behind the scenes, adding dropouts and no detail.
# mic_rate = 16000

# 1024 frames (~21 ms). Measured on a Bluetooth mic: 4096 produced 9-26%
# digital silence, 1024 produced 0.2%. Large WASAPI buffers starve between
# packets and return zeros. 256 starves the other way (62%).
block_frames = 1024

# Let a lazily-opened mic settle before the file opens. A fresh Bluetooth
# stream dropped ~20% of its first five seconds and 0.0% for the next 45.
warmup_seconds = 1.5

# Keep the mic closed until a meeting starts, so a Bluetooth headset stays in
# A2DP and your music is not 16 kHz mono all day. Costs mic pre-roll only.
lazy_mic = true

# High-pass then normalise the mic track. Desk mics sit in a bath of
# sub-300 Hz rumble that buries the speech band; measured 88% below 300 Hz
# before filtering, 8% in the 300-3000 Hz band where intelligibility lives.
clean_mic = true
highpass_hz = 300.0             # 300 suits a headset; 120-150 a close wired
                                # mic. Too high = thin, too low = boomy.
keep_raw_mic = false            # true also writes *-mic-raw.wav for A/B

# Bluetooth packet loss arrives as runs of exact zeros, which sound like
# clicks. Short gaps are bridged from surrounding audio, long ones ramped.
conceal_dropouts = true

# Rewrite a narrowband track at its true rate instead of storing upsampled
# 48 kHz carrying 16 kHz of information. Off by default: it saves disk and
# nothing else, and the measurement sits near its threshold.
normalize_mic_rate = false

[screenshots]
# Visual context from the meeting window: shared slides, demos, whiteboards.
# Off by default — it captures what is on screen, which deserves a deliberate
# choice. Needs the extra:  py -m pip install -e ".[screenshots]"
screenshots = false

# Pinned to the meeting app's own window, never the whole monitor, so email
# and Slack sitting behind it are not captured. Only while that window is in
# the foreground: alt-tab away and capture pauses, which also means whatever
# you switched to is never recorded.
screenshot_foreground_only = true

# Capture whatever window is on top, not only the meeting window. Needed to
# catch your OWN screen shares: Teams and Zoom stream shared content out
# rather than rendering it back into their window, so sharing a browser tab
# shows up as a "you are sharing" banner and nothing else. Following the
# foreground catches the tab itself.
# The cost: anything you look at during a call can be archived. See
# screenshot_exclude below.
screenshot_follow_foreground = true

# Never captured, whatever is on top. Substrings matched case-insensitively
# against window title and process name. Omit to use the built-in list:
# password managers, authenticators, banking, payroll, private browsing.
# screenshot_exclude = ["password", "bitwarden", "bank", "incognito", "Signal"]

screenshot_interval = 3.0          # how often to look at the window
screenshot_min_gap = 15.0          # never save more often than this
screenshot_change_threshold = 12   # dhash bits 0-64; lower = fussier.
                                   # Measured: slide changes score 14-21,
                                   # a moving cursor 0, webcam churn 2.
screenshot_quality = 70
screenshot_max_per_meeting = 200

[storage]
# "drive"    = Google Drive for Desktop (filesystem move, no auth) <- start here
# "driveapi" = Drive API v3 resumable upload (needs an OAuth client)
# "local"    = plain directory
backend = "drive"
drive_folder = "Meeting Recordings"
group_by = "month"              # month | day | flat

# Auto-detected if omitted. Set explicitly with several Drive accounts.
# drive_root = "G:/My Drive"

# backend = "local" only
# archive_dir = "D:/Archive/Meetings"

# backend = "driveapi" only. Note: an External consent screen still in
# Testing expires refresh tokens after 7 days.
# drive_credentials = "client_secret.json"
# drive_token = "token.json"
# drive_shared_drive_id = ""

[misc]
notify_on_start = true          # placeholder — not yet implemented
